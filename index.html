    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .subtitle {
            color: #666;
            font-size: 0.875rem;
            font-weight: 400;
            margin-bottom: 3rem;
            letter-spacing: 0.02em;
        }

        .topic-display {
            background: linear-gradient(135deg, #1a1a1a 0%, #111 100%);
            border: 1px solid #222;
            border-radius: 16px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .topic-display.rolling {
            border-color: transparent;
            background: linear-gradient(135deg, #1a1a1a 0%, #111 100%), 
                        linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            animation: borderGlow 2s linear infinite;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3),
                        0 0 60px rgba(0, 255, 255, 0.2);
        }

        @keyframes borderGlow {
            0% { border-color: #ff00ff; }
            33% { border-color: #00ffff; }
            66% { border-color: #ff00ff; }
            100% { border-color: #00ffff; }
        }

        .topic-display::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        .topic-text {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            line-height: 1.4;
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .topic-text.rolling {
            opacity: 1;
            transform: scale(1);
            animation: neonPulse 0.1s ease-in-out infinite alternate;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }

        @keyframes neonPulse {
            from {
                color: #ff00ff;
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            }
            to {
                color: #00ffff;
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            }
        }

        .topic-text.revealed {
            animation: reveal 0.5s ease-out;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spin-button {
            background: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);
            color: #0a0a0a;
            border: none;
            padding: 1rem 3rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: -0.01em;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4),
                        0 0 40px rgba(0, 255, 255, 0.2);
        }

        .spin-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.6),
                        0 0 60px rgba(0, 255, 255, 0.4);
        }

        .spin-button:active {
            transform: translateY(0);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .footer {
            margin-top: 3rem;
            color: #333;
            font-size: 0.75rem;
            font-weight: 400;
        }
    </style>

        </div>
        
        <button class="spin-button" id="spinButton" onclick="spinTopic()">Spin Topic</button>

        let isRolling = false;
        let rollInterval;
        const topicElement = document.getElementById('topic');
        const spinButton = document.getElementById('spinButton');

        function spinTopic() {
            if (isRolling) return;
            
            isRolling = true;
            spinButton.disabled = true;
            topicElement.classList.add('rolling');
            topicElement.classList.remove('revealed');
            document.querySelector('.topic-display').classList.add('rolling');
            
            let counter = 0;
            const totalRolls = 20;
            const rollDuration = 2000;
            const intervalTime = rollDuration / totalRolls;
            
            rollInterval = setInterval(() => {
                const randomTopic = topics[Math.floor(Math.random() * topics.length)];
                topicElement.textContent = randomTopic;
                counter++;
                
                if (counter >= totalRolls) {
                    clearInterval(rollInterval);
                    finalizeTopic();
                }
            }, intervalTime);
        }

        function finalizeTopic() {
            const finalTopic = topics[Math.floor(Math.random() * topics.length)];
            topicElement.textContent = finalTopic;
            topicElement.classList.remove('rolling');
            topicElement.classList.add('revealed');
            document.querySelector('.topic-display').classList.remove('rolling');
            
            isRolling = false;
            spinButton.disabled = false;
        }
