    <title>On The Spot - Random Topic Generator</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        body.light-mode {
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-weight: 500;
            font-size: 2.5rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            opacity: 0.9;
            transition: color 0.3s ease;
        }

        body.light-mode h1 {
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            font-weight: 300;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
        }

        body.light-mode .subtitle {
            color: #666;
        }

        .course-selector {
            margin-bottom: 2rem;
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .course-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.3s ease;
            border-radius: 50px;
        }

        body.light-mode .course-btn {
            color: #1a1a1a;
            border-color: #e0e0e0;
        }

        .course-btn:hover {
            border-color: #008080;
            color: #008080;
        }

        .course-btn.active {
            background: #008080;
            color: #fff;
            border-color: #008080;
        }

        .topic-display {
            background: transparent;
            border: none;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .topic-pair {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .topic-item {
            text-align: center;
        }

        .topic-label {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        body.light-mode .topic-label {
            color: #999;
        }


        .topic-text {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        body.light-mode .topic-text {
            color: #1a1a1a;
        }

        .topic-text.rolling {
            animation: neonPulse 0.1s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            from {
                color: #008080;
            }
            to {
                color: #00a0a0;
            }
        }

        .topic-text.revealed {
            animation: reveal 0.5s ease-out;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer-section {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: transparent;
            display: none;
        }

        .timer-section.active {
            display: block;
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: 400;
            color: #fff;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            background: transparent;
            border: 1px solid #333;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        body.light-mode .timer-display {
            color: #1a1a1a;
            border-color: #e0e0e0;
        }

        .timer-display:hover {
            border-color: #008080;
            color: #008080;
        }

        .timer-display:focus {
            outline: none;
            border-color: #008080;
            color: #008080;
        }

        .timer-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

            background: transparent;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }

            color: #1a1a1a;
        }

        .timer-btn:hover {
            color: #008080;
        }

            position: absolute;
            top: 2rem;
            right: 2rem;
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        body.light-mode .theme-toggle {
            color: #1a1a1a;
            border-color: #e0e0e0;
        }

        .theme-toggle:hover {
            border-color: #008080;
            color: #008080;
        }

        .spin-button {
            background: transparent;
            color: #008080;
            border: 1px solid #008080;
            padding: 1rem 3rem;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.1em;
            border-radius: 50px;
        }

        .spin-button:hover {
            color: #00a0a0;
            border-color: #00a0a0;
        }

        .spin-button:active {
            color: #008080;
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer-toggle {
            background: transparent;
            color: #666;
            border: none;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            margin-top: 1rem;
            transition: color 0.3s ease;
        }

            color: #666;
        }

            color: #008080;
        }

            margin-top: 3rem;
            color: #666;
            font-size: 0.75rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        body.light-mode .footer {
            color: #999;
        }

    <button class="theme-toggle" onclick="toggleTheme()">☀/☾</button>
    
    <div class="container">
        <h1>On The Spot</h1>
        <p class="subtitle">Select course and spin to get topics to relate</p>
        
        <div class="course-selector">
            <button class="course-btn active" onclick="setCourse('social-work')" id="social-work">Social Work</button>
            <button class="course-btn" onclick="setCourse('hrm')" id="hrm">HRM</button>
            <button class="course-btn" onclick="setCourse('finance')" id="finance">Finance Management</button>
        </div>
        
        <div class="topic-display">
            <div class="topic-pair">
                <div class="topic-item">
                    <p class="topic-label">Course Topic</p>
                    <p class="topic-text" id="topic1">Ready to spin?</p>
                </div>
                <div class="topic-item">
                    <p class="topic-label">Psychology Topic</p>
                    <p class="topic-text" id="topic2">Ready to spin?</p>
                </div>
            </div>
        </div>
        
        <button class="spin-button" id="spinButton" onclick="spinTopic()">Spin Topics</button>
        <button class="timer-toggle" onclick="toggleTimer()">⏱ Timer</button>
        
        <div class="timer-section" id="timerSection">
            <input type="text" class="timer-display" id="timerDisplay" value="2:00" onclick="this.select()">
            <div class="timer-controls">
                <button class="timer-btn" onclick="startTimer()">▶</button>
                <button class="timer-btn" onclick="pauseTimer()">⏸</button>
                <button class="timer-btn" onclick="resetTimer()">↺</button>
            </div>
        </div>
        
        <p class="footer">Made by Sarah Abane</p>
    </div>

                    "Behavior Modification",
                    "Operant Conditioning",
                    "Classical Conditioning",
                    "Pavlovian Conditioning",
                    "Skinner Box",
                    "Reinforcement",
                    "Punishment",
                    "Positive Reinforcement",
                    "Negative Reinforcement",
                    "Positive Punishment",
                    "Negative Punishment",
                    "Schedules of Reinforcement",
                    "Continuous Reinforcement",
                    "Intermittent Reinforcement",
                    "Fixed Ratio",
                    "Variable Ratio",
                    "Fixed Interval",
                    "Variable Interval",
                    "Shaping",
                    "Chaining",
                    "Fading",
                    "Token Economy",
                    "Contingency Management",
                    "Behavioral Contract",
                    "Modeling",
                    "Observational Learning",
                    "Social Learning Theory",
                    "Bandura's Theory",
                    "Self-Efficacy",
                    "Reciprocal Determinism"
                ]
            }
        };

        let currentCourse = 'social-work';
        let topicCount = 2;

        let isRolling = false;
        let rollInterval;
        const spinButton = document.getElementById('spinButton');

        function setCourse(course) {
            currentCourse = course;
            
            // Update button states
            const courses = ['psychology', 'social-work', 'hrm', 'finance'];
            courses.forEach(c => {
                const btn = document.getElementById(c);
                btn.classList.remove('active');
            });
            document.getElementById(course).classList.add('active');
        }

        function getTopicElements() {
            const elements = [];
            for (let i = 1; i <= topicCount; i++) {
                elements.push(document.getElementById(`topic${i}`));
            }
            return elements;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function toggleTimer() {
            const timerSection = document.getElementById('timerSection');
            timerSection.classList.toggle('active');
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    pauseTimer();
                    alert('Time is up!');
                }
            }, 1000);
        }

        function pauseTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 120;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            document.getElementById('timerDisplay').value = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function parseTimerInput() {
            const input = document.getElementById('timerDisplay').value;
            const parts = input.split(':');
            if (parts.length === 2) {
                const minutes = parseInt(parts[0]) || 0;
                const seconds = parseInt(parts[1]) || 0;
                timerSeconds = Math.max(0, minutes * 60 + seconds);
            }
        }

        document.getElementById('timerDisplay').addEventListener('change', parseTimerInput);
        document.getElementById('timerDisplay').addEventListener('blur', parseTimerInput);

        function spinTopic() {
            if (isRolling) return;
            
            isRolling = true;
            spinButton.disabled = true;
            
            const topicElements = getTopicElements();
            topicElements.forEach(el => {
                el.classList.add('rolling');
                el.classList.remove('revealed');
            });
            
            const courseTopics = topicSets[currentCourse].course;
            const psychologyTopics = topicSets[currentCourse].psychology;
            
            let counter = 0;
            const totalRolls = 20;
            const rollDuration = 2000;
            const intervalTime = rollDuration / totalRolls;
            
            rollInterval = setInterval(() => {
                const randomCourseTopic = courseTopics[Math.floor(Math.random() * courseTopics.length)];
                const randomPsychTopic = psychologyTopics[Math.floor(Math.random() * psychologyTopics.length)];
                
                topicElements[0].textContent = randomCourseTopic;
                topicElements[1].textContent = randomPsychTopic;
                
                counter++;
                
                if (counter >= totalRolls) {
                    clearInterval(rollInterval);
                    finalizeTopic();
                }
            }, intervalTime);
        }

        function finalizeTopic() {
            const topicElements = getTopicElements();
            const courseTopics = topicSets[currentCourse].course;
            const psychologyTopics = topicSets[currentCourse].psychology;
            
            const finalCourseTopic = courseTopics[Math.floor(Math.random() * courseTopics.length)];
            const finalPsychTopic = psychologyTopics[Math.floor(Math.random() * psychologyTopics.length)];
            
            topicElements[0].textContent = finalCourseTopic;
            topicElements[1].textContent = finalPsychTopic;
            
            topicElements.forEach(el => {
                el.classList.remove('rolling');
                el.classList.add('revealed');
            });
            
            isRolling = false;
            spinButton.disabled = false;
        }
    </script>
</body>
</html>
