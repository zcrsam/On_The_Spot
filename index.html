    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        body.light-mode {
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #fff;
            font-weight: 500;
            font-size: 2.5rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            opacity: 0.9;
            transition: color 0.3s ease;
        }

        body.light-mode h1 {
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            font-weight: 300;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
            transition: color 0.3s ease;
        }

        body.light-mode .subtitle {
            color: #666;
        }

        .topic-count-selector {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .count-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-family: inherit;
            transition: all 0.3s ease;
            border-radius: 50px;
        }

        body.light-mode .count-btn {
            color: #1a1a1a;
            border-color: #e0e0e0;
        }

        .count-btn:hover {
            border-color: #ff00ff;
            color: #ff00ff;
        }

        .count-btn.active {
            background: #ff00ff;
            color: #0a0a0a;
            border-color: #ff00ff;
        }

        .topic-display {
            background: transparent;
            border: none;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .topic-pair {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .topic-item {
            text-align: center;
        }

        .topic-label {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        body.light-mode .topic-label {
            color: #999;
        }


        .topic-text {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1.4;
            transition: all 0.3s ease;
        }

        body.light-mode .topic-text {
            color: #1a1a1a;
        }

        .topic-text.rolling {
            animation: neonPulse 0.1s ease-in-out infinite alternate;
        }

        @keyframes neonPulse {
            from {
                color: #ff00ff;
            }
            to {
                color: #00ffff;
            }
        }

        .topic-text.revealed {
            animation: reveal 0.5s ease-out;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer-section {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: transparent;
            display: none;
        }

        .timer-section.active {
            display: block;
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: 400;
            color: #fff;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        body.light-mode .timer-display {
            color: #1a1a1a;
        }

        .timer-controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .timer-btn {
            background: transparent;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.3s ease;
        }

        body.light-mode .timer-btn {
            color: #1a1a1a;
        }

        .timer-btn:hover {
            color: #ff00ff;
        }

            position: absolute;
            top: 2rem;
            right: 2rem;
            background: transparent;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: color 0.3s ease;
        }

        body.light-mode .theme-toggle {
            color: #1a1a1a;
        }

        .theme-toggle:hover {
            color: #ff00ff;
        }

            background: transparent;
            color: #ff00ff;
            border: 1px solid #ff00ff;
            padding: 1rem 3rem;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 0.1em;
            border-radius: 50px;
        }

        .spin-button:hover {
            color: #00ffff;
            border-color: #00ffff;
        }

        .spin-button:active {
            color: #ff00ff;
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer-toggle {
            background: transparent;
            color: #666;
            border: none;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            margin-top: 1rem;

            color: #666;

            margin-top: 3rem;
            color: #666;
            font-size: 0.75rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        body.light-mode .footer {
            color: #999;
        }

<body>
    <button class="theme-toggle" onclick="toggleTheme()">☀/☾</button>
    
    <div class="container">
        <h1>On The Spot</h1>
        <p class="subtitle">Spin to get random topics</p>
        
        <div class="topic-count-selector">
            <button class="count-btn" onclick="setTopicCount(1)" id="count1">1</button>
            <button class="count-btn active" onclick="setTopicCount(2)" id="count2">2</button>
            <button class="count-btn" onclick="setTopicCount(3)" id="count3">3</button>
        </div>
        
        <div class="topic-display">
            <div class="topic-pair">
                <div class="topic-item">
                    <p class="topic-label">Topic 1</p>
                    <p class="topic-text" id="topic1">Ready to spin?</p>
                </div>
                <div class="topic-item">
                    <p class="topic-label">Topic 2</p>
                    <p class="topic-text" id="topic2">Ready to spin?</p>
                </div>
            </div>
        </div>
        
        <button class="spin-button" id="spinButton" onclick="spinTopic()">Spin Topics</button>
        <button class="timer-toggle" onclick="toggleTimer()">⏱ Timer</button>
        
        <div class="timer-section" id="timerSection">
            <p class="timer-display" id="timerDisplay">2:00</p>
            <div class="timer-controls">
                <button class="timer-btn" onclick="startTimer()">▶</button>
                <button class="timer-btn" onclick="pauseTimer()">⏸</button>
                <button class="timer-btn" onclick="resetTimer()">↺</button>
            </div>
        </div>
        
        <p class="footer">Made by Sarah Abane</p>
    </div>

        let currentTopics = topicSets['mixed'];
        let topicCount = 2;

        let isRolling = false;
        let rollInterval;
        const spinButton = document.getElementById('spinButton');

        function getTopicElements() {
            const elements = [];
            for (let i = 1; i <= topicCount; i++) {
                elements.push(document.getElementById(`topic${i}`));
            }
            return elements;
        }

        let timerInterval;
        let timerSeconds = 120;
        let timerRunning = false;

        function setTopicCount(count) {
            topicCount = count;
            
            // Update button states
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`count${i}`);
                btn.classList.remove('active');
            }
            document.getElementById(`count${count}`).classList.add('active');
            
            updateTopicDisplay();
        }

        function updateTopicDisplay() {
            const topicPair = document.querySelector('.topic-pair');
            topicPair.innerHTML = '';
            
            for (let i = 1; i <= topicCount; i++) {
                const topicItem = document.createElement('div');
                topicItem.className = 'topic-item';
                topicItem.innerHTML = `
                    <p class="topic-label">Topic ${i}</p>
                    <p class="topic-text" id="topic${i}">Ready to spin?</p>
                `;
                topicPair.appendChild(topicItem);
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function toggleTimer() {
            const timerSection = document.getElementById('timerSection');
            timerSection.classList.toggle('active');
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                if (timerSeconds > 0) {
                    timerSeconds--;
                    updateTimerDisplay();
                } else {
                    pauseTimer();
                    alert('Time is up!');
                }
            }, 1000);
        }

        function pauseTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 120;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function spinTopic() {
            if (isRolling) return;
            
            isRolling = true;
            spinButton.disabled = true;
            
            const topicElements = getTopicElements();
            topicElements.forEach(el => {
                el.classList.add('rolling');
                el.classList.remove('revealed');
            });
            
            let counter = 0;
            const totalRolls = 20;
            const rollDuration = 2000;
            const intervalTime = rollDuration / totalRolls;
            
            rollInterval = setInterval(() => {
                const selectedTopics = [];
                const usedTopics = new Set();
                
                for (let i = 0; i < topicCount; i++) {
                    let randomTopic;
                    do {
                        randomTopic = currentTopics[Math.floor(Math.random() * currentTopics.length)];
                    } while (usedTopics.has(randomTopic) && usedTopics.size < currentTopics.length);
                    
                    usedTopics.add(randomTopic);
                    selectedTopics.push(randomTopic);
                }
                
                topicElements.forEach((el, index) => {
                    el.textContent = selectedTopics[index];
                });
                
                counter++;
                
                if (counter >= totalRolls) {
                    clearInterval(rollInterval);
                    finalizeTopic();
                }
            }, intervalTime);
        }

        function finalizeTopic() {
            const topicElements = getTopicElements();
            const selectedTopics = [];
            const usedTopics = new Set();
            
            for (let i = 0; i < topicCount; i++) {
                let randomTopic;
                do {
                    randomTopic = currentTopics[Math.floor(Math.random() * currentTopics.length)];
                } while (usedTopics.has(randomTopic) && usedTopics.size < currentTopics.length);
                
                usedTopics.add(randomTopic);
                selectedTopics.push(randomTopic);
            }
            
            topicElements.forEach((el, index) => {
                el.textContent = selectedTopics[index];
                el.classList.remove('rolling');
                el.classList.add('revealed');
            });
            
            isRolling = false;
            spinButton.disabled = false;
        }
